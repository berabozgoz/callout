# cargo-deny: dependency policy (CLAUDE.md rule 5: MIT OR Apache-2.0 project, no GPL/AGPL).
# Run: cargo deny check licenses sources   (CI runs it on every push)

[graph]
# Only the platforms we ship: the Windows app/server, the macOS app and the Linux server.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
# Permissive licenses only. Add to this list deliberately, never a copyleft license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

# MPL-2.0 is file-level copyleft: using these unmodified is compatible with MIT/Apache-2.0
# distribution (only changes to their own files would have to be shared). They come in through
# Tauri (HTML/CSS parsing in tauri-utils, `dirs`), not through our code. Allowed per crate, not globally.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

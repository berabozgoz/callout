[package]
name = "callout-input"
description = "Push-to-talk listener: keys, key combinations and mouse buttons, observed without swallowing them"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Already in the tree through Tauri; only the features below are added.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Quartz event taps and the run loop; already in the tree through Tauri (tao, wry).
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFDate",
    "CFMachPort",
    "CFRunLoop",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }

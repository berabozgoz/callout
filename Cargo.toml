[workspace]
resolver = "2"
members = [
    "crates/callout-proto",
    "crates/callout-audio",
    "crates/callout-net",
    "crates/callout-core",
    "crates/callout-server",
    "crates/callout-input",
    "crates/callout-priority",
    "apps/callout-app",
]
# callout-app pulls in Tauri plugins (webkit etc.); Linux CI builds only the
# library crates: `cargo check --workspace --exclude callout-app`.
default-members = [
    "crates/callout-proto",
    "crates/callout-audio",
    "crates/callout-net",
    "crates/callout-core",
    "crates/callout-server",
    "crates/callout-input",
    "crates/callout-priority",
]

[workspace.package]
version = "0.1.18"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/berabozgoz/callout"
rust-version = "1.91"

[workspace.dependencies]
callout-proto = { path = "crates/callout-proto" }
callout-audio = { path = "crates/callout-audio" }
callout-net = { path = "crates/callout-net" }
callout-core = { path = "crates/callout-core" }
callout-input = { path = "crates/callout-input" }
callout-priority = { path = "crates/callout-priority" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs", "io-util", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
cpal = "0.15"
ringbuf = "0.4"
opus = "0.4"
nnnoiseless = { version = "0.5", default-features = false }
# Echo cancellation: pure-Rust port of WebRTC audio processing (AEC3). BSD-3-Clause.
sonora = "0.3"
rubato = { version = "0.16", default-features = false, features = ["fft_resampler"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep the audio callback reasonably fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2

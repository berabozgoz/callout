name: Release

# On a `v*` tag: builds the Windows installer (NSIS), the portable exe and the server exe
# and uploads them to GitHub Releases.
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take version from tag
        shell: bash
        run: |
          # The tag (v0.1.5) is the single source of truth: the installer file name and the version shown in the UI come from it.
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z: $tag"; exit 1; }
          v="${tag#v}"
          sed -i -E '/^\[workspace\.package\]/,/^version/ s/^version = .*/version = "'"$v"'"/' Cargo.toml
          grep -q "^version = \"$v\"" Cargo.toml || { echo "failed to write version to Cargo.toml"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Tauri app (NSIS installer + exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (minisign). Lose it and installed apps can no longer update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/callout-app
          # latest.json on the release: the in-app updater's endpoint.
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: "CallOut ${{ github.ref_name }}"
          releaseBody: |
            **For friends:** download and install `CallOut_*_x64-setup.exe` (on the SmartScreen warning, choose
            "More info → Run anyway"). If you'd rather not install, you can run `callout-app.exe` directly.
            When the app opens, enter a nickname and the `callout://` invite link you were sent.

            **For whoever hosts the server:**
            - Linux VPS (x64, e.g. Ubuntu 24.04), as root:
              `curl -fsSL https://raw.githubusercontent.com/berabozgoz/callout/main/deploy/install.sh | sudo bash`
              It installs `callout-server-linux-x64` as the `callout` systemd service, opens 4433/udp in the local
              firewall and prints the invite link. Also allow UDP 4433 in your provider's firewall. Run the same
              command again to update; logs: `journalctl -u callout -f`.
            - Windows: run `callout-server.exe` and share the invite link it prints (UDP 4433 must be reachable).
          releaseDraft: false
          prerelease: false
      - name: Server and portable exe
        run: |
          cargo build --release -p callout-server
          Copy-Item target/release/callout-server.exe callout-server.exe
          Copy-Item target/release/callout-app.exe callout-app.exe
      - name: Attach extra files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} callout-server.exe callout-app.exe --clobber

  linux-server:
    # Built against an older glibc so it runs on any Ubuntu 22.04+ / Debian 12+ VPS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Take version from tag
        shell: bash
        run: |
          # The tag (v0.1.5) is the single source of truth: the installer file name and the version shown in the UI come from it.
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z: $tag"; exit 1; }
          v="${tag#v}"
          sed -i -E '/^\[workspace\.package\]/,/^version/ s/^version = .*/version = "'"$v"'"/' Cargo.toml
          grep -q "^version = \"$v\"" Cargo.toml || { echo "failed to write version to Cargo.toml"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Server (Linux x64)
        run: |
          cargo build --release -p callout-server
          cp target/release/callout-server callout-server-linux-x64
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Windows job creates the release; wait if it does not exist yet.
          for i in $(seq 1 30); do gh release view ${{ github.ref_name }} >/dev/null 2>&1 && break; sleep 20; done
          gh release upload ${{ github.ref_name }} callout-server-linux-x64 --clobber

name: Release

# `v*` etiketi atılınca: Windows kurulum (NSIS), taşınabilir exe ve sunucu exe'sini
# derleyip GitHub Releases'a yükler.
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürümü etiketten al
        shell: bash
        run: |
          # Etiket (v0.1.5) tek doğruluk kaynağı: kurulum dosyası adı ve arayüzdeki sürüm buradan gelir.
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "etiket vX.Y.Z olmalı: $tag"; exit 1; }
          v="${tag#v}"
          sed -i -E '/^\[workspace\.package\]/,/^version/ s/^version = .*/version = "'"$v"'"/' Cargo.toml
          grep -q "^version = \"$v\"" Cargo.toml || { echo "Cargo.toml sürümü yazılamadı"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Tauri uygulaması (NSIS kurulum + exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/callout-app
          tagName: ${{ github.ref_name }}
          releaseName: "CallOut ${{ github.ref_name }}"
          releaseBody: |
            **Arkadaşlar için:** `CallOut_*_x64-setup.exe` dosyasını indirip kurun (SmartScreen uyarısında
            "Daha fazla bilgi → Yine de çalıştır"). Kurulum istemeyenler `callout-app.exe`'yi doğrudan çalıştırabilir.
            Uygulamayı açınca takma ad ve size gönderilen `callout://` davet linkini girin.

            **Sunucu kuran için:** `callout-server.exe`'yi çalıştırın; ekrana basılan davet linkini paylaşın.
          releaseDraft: false
          prerelease: false
      - name: Sunucu ve taşınabilir exe
        run: |
          cargo build --release -p callout-server
          Copy-Item target/release/callout-server.exe callout-server.exe
          Copy-Item target/release/callout-app.exe callout-app.exe
      - name: Ek dosyaları sürüme ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} callout-server.exe callout-app.exe --clobber

  linux-server:
    # Eski glibc ile derlenir ki Ubuntu 22.04+ / Debian 12+ her VPS'te çalışsın.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Sürümü etiketten al
        shell: bash
        run: |
          # Etiket (v0.1.5) tek doğruluk kaynağı: kurulum dosyası adı ve arayüzdeki sürüm buradan gelir.
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "etiket vX.Y.Z olmalı: $tag"; exit 1; }
          v="${tag#v}"
          sed -i -E '/^\[workspace\.package\]/,/^version/ s/^version = .*/version = "'"$v"'"/' Cargo.toml
          grep -q "^version = \"$v\"" Cargo.toml || { echo "Cargo.toml sürümü yazılamadı"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sunucu (Linux x64)
        run: |
          cargo build --release -p callout-server
          cp target/release/callout-server callout-server-linux-x64
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sürüm kaydını Windows işi açar; henüz yoksa bekle.
          for i in $(seq 1 30); do gh release view ${{ github.ref_name }} >/dev/null 2>&1 && break; sleep 20; done
          gh release upload ${{ github.ref_name }} callout-server-linux-x64 --clobber

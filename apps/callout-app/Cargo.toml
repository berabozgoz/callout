[package]
name = "callout-app"
description = "CallOut desktop app (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "callout_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Web Inspector in a release build, opened at start. Only for diagnostic builds (CI's macOS test
# DMG); never in a release (on macOS it uses private WebKit API).
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
callout-core.workspace = true
callout-input.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tokio.workspace = true
serde.workspace = true
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
# Reads the language picked in the NSIS installer (already in the tree via Tauri).
windows-registry = "0.6"
